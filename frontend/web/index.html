<!doctype html>
<html lang="zh-CN">
  <head>
    <title>%VITE_APP_TITLE%</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vue3 + Vite + TypeScript + Element-Plus 的后台管理模板" />
    <meta
      name="keywords"
      content="vue,element-plus,typescript,vue-element-admin,vue3-element-admin"
    />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />

    <style>
      /* 防止 Vue 加载前出现白屏：背景色与主题初始 class 同步 */
      html {
        background-color: #fafbfc;
      }

      html.dark {
        background-color: #070707;
      }
    </style>

    <script>
      /**
       * 在 Vue 挂载前同步主题 class。
       *
       * Vue 初始化后 useTheme 会接管主题管理，
       * 但在此之前若用户之前选择了暗色主题，html 缺少 "dark" class 会导致闪烁。
       * 此处直接从 localStorage 读取主题偏好并提前设置 class。
       *
       * key "sys-theme" 须与 StorageConfig.THEME_KEY 保持一致。
       */
      (function () {
        try {
          if (typeof Storage === "undefined" || !window.localStorage) {
            return;
          }

          const themeType = localStorage.getItem("sys-theme");
          if (themeType === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          console.warn("Failed to apply initial theme:", e);
        }
      })();

      /**
       * 在 Vue 挂载前用本地缓存的系统名称替换静态标题。
       *
       * 标题的静态值是构建期写入的 %VITE_APP_TITLE%，JS 加载完成前标签页会一直显示它，
       * 刷新时表现为「先闪一下默认名」。此处直接从 localStorage 读取后台「系统参数」
       * 里的 sys_name（configStore 持久化 key "config"）提前覆盖，避免闪烁。
       *
       * key "config" 须与 config.store 的 persist.key 保持一致。
       */
      (function () {
        try {
          if (typeof Storage === "undefined" || !window.localStorage) {
            return;
          }

          const raw = localStorage.getItem("config");
          if (!raw) return;

          const parsed = JSON.parse(raw);
          // 兼容 pinia-plugin-persistedstate 的两种序列化结构
          const configData = parsed?.configData || parsed?.state?.configData;
          const name = configData?.sys_name?.config_value;

          if (typeof name === "string" && name.trim()) {
            document.title = name.trim();
          }
        } catch (e) {
          console.warn("Failed to apply initial title:", e);
        }
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
